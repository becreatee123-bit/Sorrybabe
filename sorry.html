<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sorry, baby</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;touch-action:manipulation}
body{--H:min(64%,80vw);background:linear-gradient(170deg,#ffe0ea 0%,#ffb3c8 100%);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#7a1034;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));overflow:hidden}
h1{margin:0;font-size:1.25rem;text-align:center;font-weight:800}
.stage{position:relative;width:100%;max-width:520px;flex:1;margin:8px 0;min-height:0}
.floor{position:absolute;left:3%;right:3%;bottom:0;height:5%;background:rgba(122,16,52,.12);border-radius:50%;filter:blur(2px)}
.boy,.girl{position:absolute;bottom:3%;height:var(--H)}
.boy{left:2%;aspect-ratio:.466/1;transform-origin:50% 100%}
.girl{right:2%;height:calc(var(--H) * .92);aspect-ratio:.497/1;cursor:pointer}
.boy img,.girl img{position:absolute;bottom:0;opacity:0;pointer-events:none;display:block}
.boy img{left:50%;transform:translateX(-50%)}
.girl img{right:0}
.bFront{height:100%}.bCry{height:100%}.boy img.bKneel{height:84%;left:0;transform:none}
.gIdle,.gHit,.gHappy{height:100%}
.boy[data-s=front] .bFront,.boy[data-s=cry] .bCry,.boy[data-s=kneel] .bKneel,
.girl[data-s=idle] .gIdle,.girl[data-s=hit] .gHit,.girl[data-s=happy] .gHappy{opacity:1}
.girl.lunge{animation:lunge .5s ease-in-out}
.girl[data-s=hit] .gHit{transform-origin:72% 92%;animation:lean .5s ease-in-out}
.boy.bonk{animation:bonk .55s ease-out}
.girl.joy{animation:joy .6s ease-in-out 3}
@keyframes lunge{0%{transform:translateX(0)}28%{transform:translateX(10px)}55%{transform:translateX(calc(var(--shift) * -1))}100%{transform:translateX(0)}}
@keyframes lean{0%{transform:rotate(0)}28%{transform:rotate(9deg)}55%{transform:rotate(-12deg)}100%{transform:rotate(0)}}
@keyframes bonk{0%,50%{transform:none}60%{transform:scale(1.08,.84) rotate(-4deg)}80%{transform:scale(.98,1.03) rotate(2deg)}100%{transform:none}}
@keyframes joy{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.bubble{position:absolute;left:2%;bottom:calc(3% + var(--H) + 6px);background:#fff;color:#a0144b;font-weight:800;border-radius:18px;padding:8px 14px;max-width:62%;text-align:center;opacity:0;transform:scale(.7);transition:opacity .12s,transform .12s;box-shadow:0 3px 0 rgba(160,20,75,.18);z-index:5}
.bubble.right{left:auto;right:2%}
.bubble.show{opacity:1;transform:scale(1)}
.whack{position:absolute;left:18%;bottom:calc(3% + var(--H) - 50px);font-size:2.1rem;font-weight:900;color:#ffd23f;-webkit-text-stroke:2px #b3123f;opacity:0;pointer-events:none;z-index:6}
.whack.go{animation:pop .6s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-10deg)}25%{opacity:1;transform:scale(1.25) rotate(-10deg)}100%{opacity:0;transform:scale(1) translateY(-28px) rotate(-10deg)}}
.feather{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;pointer-events:none;z-index:5;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.info{text-align:center}
.count{font-size:1.05rem;font-weight:800}
.hint{opacity:.75;font-size:.9rem;margin-top:2px}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.hearts span{position:absolute;bottom:-40px;font-size:30px;animation:up 2.6s linear forwards}
@keyframes up{to{transform:translateY(-115vh)}}
#again{display:none;font:inherit;font-weight:800;color:#fff;background:#d6336c;border:0;border-radius:999px;padding:8px 20px;margin-bottom:8px;box-shadow:0 3px 0 #a0144b}
#again:active{transform:translateY(2px);box-shadow:0 1px 0 #a0144b}
@media (prefers-reduced-motion:reduce){.girl.lunge,.girl[data-s=hit] .gHit,.boy.bonk,.girl.joy{animation-duration:.01s}}
</style>
</head>

    n=0;busy=false;count.textContent="Spanks: 0";hint.textContent="Tap her";again.style.display="none";
    boy.dataset.s="front";girl.dataset.s="idle";girl.classList.remove("joy","lunge");bubble.classList.remove("show");
  });
})();
